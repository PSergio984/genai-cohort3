name: CD

on:
  push:
    branches: [main]

# One deploy at a time — overlapping Cloud Run revisions cause confusion.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Required repo secret (Settings → Secrets → Actions):
    #   GCP_CREDENTIALS — service-account JSON key with roles/run.admin on the
    #   project + roles/iam.serviceAccountUser on the runtime SA below.
    #   (Workload Identity Federation is the nicer long-term option.)
    # No app secrets needed here: GEMINI/MAPS keys already live in Secret
    # Manager and mount at deploy time (see cmd.md section 3).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install + typecheck + build production bundle
        run: |
          npm ci --prefix app
          npm run typecheck --prefix app
          npm run build --prefix app

      # Skips the Cloud steps (green) until GCP_CREDENTIALS exists — the
      # secrets context is legal in steps.* but not in jobs.<id>.if, and an
      # invalid job-level guard fails the whole workflow at parse time.
      - name: Check deploy credentials present
        id: creds
        run: |
          if [ -z "${{ secrets.GCP_CREDENTIALS }}" ]; then
            echo "GCP_CREDENTIALS not set — skipping Cloud deploy (build above still validates). Add the secret to enable CD."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.creds.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        if: steps.creds.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v2

      # Mirrors cmd.md section 4 (validated syntax) + --max-instances=4 as the
      # billing guardrail. Dockerfile at repo root makes --source . deterministic.
      # NOTE: --set-secrets and --update-secrets are mutually exclusive — both
      # bindings ride one --update-secrets (slash-prefixed = volume, else env).
      # PROJECT_ID rides --set-env-vars (different flag group, so combinable):
      # without it wireJournal() degrades to health-only and /api/vaults 404s.
      - name: Deploy to Cloud Run
        if: steps.creds.outputs.skip != 'true'
        run: >
          gcloud run deploy personal-gemini-journal
          --source .
          --region us-central1
          --allow-unauthenticated
          --update-secrets=/secrets/maps-api-key=maps-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest
          --set-env-vars=PROJECT_ID=valid-meridian-475214-e3
          --service-account=273533786531-compute@developer.gserviceaccount.com
          --labels=challenge=codelab,app=grounded-journal
          --max-instances=4
          --project=valid-meridian-475214-e3
          --quiet
