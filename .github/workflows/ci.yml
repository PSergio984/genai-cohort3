name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  app:
    name: App (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        run: npm ci --prefix app

      - name: Typecheck
        run: npm run typecheck --prefix app

      # The server tests serve the built client from app/public (gitignored
      # build output), so the client builds first. Firebase web config comes
      # from repo Variables (public identifiers, never repo files).
      - name: Install + build client
        run: |
          npm ci --prefix app/client
          npm run build --prefix app/client
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Full app suite (domain + server + store, under emulator)
        run: |
          npx -y firebase-tools@latest emulators:exec \
            --only firestore --project=demo-grounded-journal \
            "npm test --prefix app"

  rules:
    name: Rules (emulator matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install rules-test deps
        run: npm ci --prefix tests/firestore

      - name: Rules behavior matrix
        run: |
          npx -y firebase-tools@latest emulators:exec \
            --only firestore --project=demo-grounded-journal \
            "npm test --prefix tests/firestore"

  parity:
    name: Parity (README↔cmd.md)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Drift + deploy-shape check
        run: node tests/parity.mjs
